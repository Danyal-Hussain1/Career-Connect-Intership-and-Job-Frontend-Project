<!DOCTYPE html>
<!-- HTML5 document declaration -->
<!--
    File: applicants.html
+  Purpose: Lists applicants for company job postings (admin/company view).
+  Sections: Navigation, Applicants table, Filters, Footer.
+  Resources: Uses Bootstrap, Font Awesome, and custom project CSS/JS.
+-->

<html lang="en">
<!-- Root element with language set to English -->

<head>
    <!-- ===== Meta & Resources ===== -->

    <meta charset="UTF-8">
    <!-- UTF-8 encoding for all characters -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive layout for all screen sizes -->

    <title>Applicants - CareerConnect</title>
    <!-- Browser tab title -->

    <!-- Bootstrap CSS for layout and UI components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom project styling -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- ===== Navigation Bar ===== -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <!-- Responsive fixed navbar -->

        <div class="container">
            <!-- Navbar content container -->

            <!-- Brand / Logo -->
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-briefcase me-2"></i>CareerConnect
            </a>

            <!-- Mobile navbar toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Dynamic navigation links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Links added dynamically via JavaScript based on user role -->
                </ul>
            </div>
        </div>
    </nav>
    <!-- ===== Navigation End ===== -->

    <!-- ===== Main Content ===== -->
    <main>
        <div class="container py-5">
            <!-- Adds spacing below fixed navbar -->

            <!-- Page Heading -->
            <h1 class="mb-4">All Applicants</h1>
            <p class="text-secondary mb-5">
                View applicants for your posted jobs.
            </p>

            <!-- Applicants Card -->
            <div class="card">
                <div class="card-body">
                    <!-- Instruction message -->
                    <p class="text-secondary">
                        Select a job from "My Jobs" to view its applicants, or use the buttons below.
                    </p>

                    <!-- Applicants List Container -->
                    <div id="applicantsList">
                        <!-- Applicant cards / rows will be injected dynamically using JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- ===== Main Content End ===== -->

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center">
                <p>&copy; 2024 CareerConnect. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- ===== JavaScript Files ===== -->

    <!-- Bootstrap JS (navbar toggle, UI behavior) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API / JSON handling -->
    <script src="../javascript/api.js"></script>

    <!-- Main script for loading applicants dynamically -->
    <script src="../javascript/script.js"></script>
</body>
</html>
