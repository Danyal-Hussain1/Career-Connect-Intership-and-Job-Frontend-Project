<!DOCTYPE html>
<!-- HTML5 document declaration -->
<!--
    File: admin-dashboard.html
+  Purpose: Admin overview page to manage users, companies and jobs.
+  Sections: Navigation, Stats, Management cards/tables, Footer.
+  Resources: Uses Bootstrap and project JS/CSS for admin interactions.
+-->

<html lang="en">
<!-- Root element, language set to English -->

<head>
    <!-- ===== Meta Information ===== -->

    <meta charset="UTF-8">
    <!-- Supports all characters (UTF-8 encoding) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes layout responsive on mobile, tablet & desktop -->

    <title>Admin Dashboard - CareerConnect</title>
    <!-- Page title shown on browser tab -->

    <!-- Bootstrap CSS (layout, grid, components) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- ===== Navigation Bar Start ===== -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <!-- Responsive fixed-top navbar -->

        <div class="container">
            <!-- Center aligned navbar content -->

            <!-- Brand / Logo -->
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-briefcase me-2"></i>CareerConnect
            </a>

            <!-- Mobile hamburger button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Home link -->
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>

                    <!-- Active dashboard link -->
                    <li class="nav-item">
                        <a class="nav-link active" href="admin-dashboard.html">Dashboard</a>
                    </li>

                    <!-- Logout link -->
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- ===== Navigation Bar End ===== -->

    <!-- ===== Main Content Start ===== -->
    <main>
        <div class="container py-5">
            <!-- Adds spacing from navbar -->

            <!-- ===== Page Header ===== -->
            <div class="mb-4">
                <h1>Admin Dashboard</h1>
                <p class="text-secondary">Manage your platform</p>
            </div>

            <!-- ===== Statistics Cards ===== -->
            <div class="row g-4 mb-5">
                <!-- Total Students -->
                <div class="col-md-4">
                    <div class="card dashboard-card">
                        <i class="fas fa-users"></i>
                        <h2 id="totalStudents">0</h2>
                        <!-- Value updated dynamically via JavaScript -->
                        <p class="mb-0">Total Students</p>
                    </div>
                </div>

                <!-- Total Companies -->
                <div class="col-md-4">
                    <div class="card dashboard-card card-companies">
                        <i class="fas fa-building"></i>
                        <h2 id="totalCompanies">0</h2>
                        <!-- Value fetched from API / JSON -->
                        <p class="mb-0">Total Companies</p>
                    </div>
                </div>

                <!-- Total Jobs -->
                <div class="col-md-4">
                    <div class="card dashboard-card card-jobs">
                        <i class="fas fa-briefcase"></i>
                        <h2 id="totalJobs">0</h2>
                        <!-- Job count updated by JavaScript -->
                        <p class="mb-0">Total Jobs</p>
                    </div>
                </div>
            </div>

            <!-- ===== Recent Users Table ===== -->
            <div class="card">
                <!-- Table Header -->
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="fas fa-users me-2"></i>Recent Users
                    </h5>
                </div>

                <!-- Table Body -->
                <div class="card-body">
                    <div class="table-container">
                        <!-- Responsive table -->
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Date Joined</th>
                                </tr>
                            </thead>

                            <!-- Table data inserted dynamically -->
                            <tbody id="recentUsersTableBody">
                                <!-- Rows populated via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <!-- ===== Main Content End ===== -->

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center">
                <p>&copy; 2024 CareerConnect. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- ===== JavaScript Files ===== -->

    <!-- Bootstrap JS (navbar toggle, components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API handling (JSON / fetch logic) -->
    <script src="../javascript/api.js"></script>

    <!-- Main JavaScript (DOM, dashboard logic) -->
    <script src="../javascript/dataStore.js"></script>
    <script src="../javascript/script.js"></script>

</body>
</html>
